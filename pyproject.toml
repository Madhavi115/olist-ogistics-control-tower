[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-logistics-control-tower"
version = "0.1.0"
description = "Phase 1: reproducible Olist logistics data pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "pyarrow>=14,<25"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
olist-pipeline = "olist_logistics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
